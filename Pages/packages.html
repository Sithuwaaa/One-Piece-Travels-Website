<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Piece Travels — Packages</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg" id="mainNavbar">
      <div class="container">
        <!-- Logo / Brand -->
        <a class="navbar-brand" href="../index.html">
          One <span>Piece</span> Travels
        </a>

        <!-- Mobile Toggle Button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="destinations.html">Destinations</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="packages.html">Packages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="fleet.html">Fleet</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn-contact" href="contact.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ===== PAGE HERO ===== -->
    <section id="page-hero">
      <div class="container">
        <!-- Breadcrumb -->
        <div class="breadcrumb-wrap">
          <a href="../index.html">Home</a>
          <span>/</span>
          <span class="current-page">Packages</span>
        </div>

        <!-- Title -->
        <h1 class="page-hero-title">Solo Caravan Packages</h1>
        <p class="page-hero-sub">
          Browse and filter curated packages for every solo travel style and
          budget.
        </p>
      </div>
    </section>

    <!-- ===== FILTER BAR ===== -->
    <section id="filter-section">
      <div class="container">
        <div class="filter-bar">
          <div class="row g-3 align-items-end">
            <!-- Destination Filter -->
            <div class="col-md-3">
              <label class="filter-label">Destination</label>
              <select class="filter-select" id="filterDest">
                <option value="">All Destinations</option>
                <option value="galle">Galle</option>
                <option value="ella">Ella</option>
                <option value="sigiriya">Sigiriya</option>
                <option value="mirissa">Mirissa</option>
                <option value="nuwara">Nuwara Eliya</option>
                <option value="trinco">Trincomalee</option>
              </select>
            </div>

            <!-- Duration Filter -->
            <div class="col-md-3">
              <label class="filter-label">Duration</label>
              <select class="filter-select" id="filterDur">
                <option value="">Any Duration</option>
                <option value="weekend">Weekend (2–3 Days)</option>
                <option value="short">Short (4–6 Days)</option>
                <option value="week">Week (7 Days)</option>
                <option value="extended">Extended (8+ Days)</option>
              </select>
            </div>

            <!-- Price Filter -->
            <div class="col-md-3">
              <label class="filter-label">Price Range</label>
              <select class="filter-select" id="filterPrice">
                <option value="">Any Price</option>
                <option value="low">Budget (Under $400)</option>
                <option value="mid">Mid ($400 – $800)</option>
                <option value="high">Premium ($800+)</option>
              </select>
            </div>

            <!-- Buttons -->
            <div class="col-md-3 d-flex gap-2">
              <button class="btn-gold w-100" id="filterSearch">
                <i class="bi bi-search me-2"></i>Search
              </button>
              <button class="btn-outline-nv" id="filterReset">Reset</button>
            </div>
          </div>
        </div>

        <!-- No Results Message (hidden by default) -->
        <div id="noResults">
          <i class="bi bi-search"></i>
          <p>No packages match your filters. Try adjusting your selection.</p>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/script.js"></script>
  </body>
</html>
